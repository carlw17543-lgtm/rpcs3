name: iOS Build

on:
  push:
    branches:
      - ios-port
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DEPLOYMENT_TARGET: '18.0'
  VULKAN_HEADERS_VER: '1.4.341'
  FFMPEG_VER: '8.1.1'

defaults:
  run:
    # Explicit bash adds pipefail, so failures before "| tee" fail the step
    shell: bash

jobs:
  llvm:
    name: LLVM for iOS
    runs-on: macos-26
    env:
      LLVM_IOS_PREFIX: ${{ github.workspace }}/llvm-ios
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute cache key
        id: key
        run: echo "key=llvm-ios-${IOS_DEPLOYMENT_TARGET}-$(git rev-parse HEAD:3rdparty/llvm/llvm)-${{ hashFiles('.ci/build-llvm-ios.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM build
        id: cache
        uses: actions/cache@v6
        with:
          path: llvm-ios
          key: ${{ steps.key.outputs.key }}

      - name: Build LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule -q update --init --depth=1 -- 3rdparty/llvm
          brew install ninja
          if ! .ci/build-llvm-ios.sh 2>&1 | tee "$RUNNER_TEMP/llvm.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/llvm.log" "Build LLVM"
            exit 1
          fi

  ffmpeg:
    name: FFmpeg for iOS
    runs-on: macos-26
    env:
      FFMPEG_IOS_PREFIX: ${{ github.workspace }}/ffmpeg-ios
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute cache key
        id: key
        run: echo "key=ffmpeg-ios-${IOS_DEPLOYMENT_TARGET}-${FFMPEG_VER}-${{ hashFiles('.ci/build-ffmpeg-ios.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg build
        id: cache
        uses: actions/cache@v6
        with:
          path: ffmpeg-ios
          key: ${{ steps.key.outputs.key }}

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if ! .ci/build-ffmpeg-ios.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/ffmpeg.log" "Build FFmpeg"
            exit 1
          fi

  core:
    name: RPCS3 core for iOS
    needs: [llvm, ffmpeg]
    runs-on: macos-26
    env:
      LLVM_IOS_PREFIX: ${{ github.workspace }}/llvm-ios
      FFMPEG_IOS_PREFIX: ${{ github.workspace }}/ffmpeg-ios
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch submodules
        # shellcheck disable=SC2046
        run: git submodule -q update --init --depth=1 --jobs=8 $(awk '/path/ && !/llvm/ && !/FAudio/ && !/feralinteractive/ && !/libsdl-org/ { print $3 }' .gitmodules)

      - name: Restore LLVM build
        uses: actions/cache/restore@v6
        with:
          path: llvm-ios
          key: ${{ needs.llvm.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore FFmpeg build
        uses: actions/cache/restore@v6
        with:
          path: ffmpeg-ios
          key: ${{ needs.ffmpeg.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install build tools
        run: brew install llvm ninja

      - name: Build RPCS3 core
        run: |
          if ! .ci/build-ios.sh 2>&1 | tee "$RUNNER_TEMP/core.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/core.log" "Build RPCS3 core"
            exit 1
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpcs3-ios-core-logs
          path: |
            build-ios/configure.log
            build-ios/build.log
            build-ios/CMakeCache.txt
            build-ios/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
