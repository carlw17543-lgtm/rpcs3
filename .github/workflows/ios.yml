name: iOS Build

on:
  push:
    branches:
      - ios-port
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_DEPLOYMENT_TARGET: '18.0'
  VULKAN_HEADERS_VER: '1.4.341'
  FFMPEG_VER: '8.1.1'

defaults:
  run:
    # Explicit bash adds pipefail, so failures before "| tee" fail the step
    shell: bash

# A single job: jobs queued after the first ones of a run kept getting no machine ("The job was not acquired
# by Runner of type hosted"), and the macos-26 pool often has none free. macos-15 runs with Xcode 26 selected,
# which keeps the iOS 26 SDK the cached LLVM and FFmpeg builds were made with.
jobs:
  ios:
    name: RPCS3 app for iOS
    runs-on: macos-15
    env:
      LLVM_IOS_PREFIX: ${{ github.workspace }}/llvm-ios
      FFMPEG_IOS_PREFIX: ${{ github.workspace }}/ffmpeg-ios
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install build tools
        run: brew install llvm ninja

      - name: Compute cache keys
        id: keys
        run: |
          echo "llvm=llvm-ios-${IOS_DEPLOYMENT_TARGET}-$(git rev-parse HEAD:3rdparty/llvm/llvm)-${{ hashFiles('.ci/build-llvm-ios.sh') }}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=ffmpeg-ios-${IOS_DEPLOYMENT_TARGET}-${FFMPEG_VER}-${{ hashFiles('.ci/build-ffmpeg-ios.sh') }}" >> "$GITHUB_OUTPUT"

      # Dependencies are saved right after they're built, so a later failure in the app build doesn't lose them
      - name: Restore LLVM build
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: llvm-ios
          key: ${{ steps.keys.outputs.llvm }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          git submodule -q update --init --depth=1 -- 3rdparty/llvm
          if ! .ci/build-llvm-ios.sh 2>&1 | tee "$RUNNER_TEMP/llvm.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/llvm.log" "Build LLVM"
            exit 1
          fi

      - name: Save LLVM build
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: llvm-ios
          key: ${{ steps.keys.outputs.llvm }}

      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ffmpeg-ios
          key: ${{ steps.keys.outputs.ffmpeg }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          if ! .ci/build-ffmpeg-ios.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/ffmpeg.log" "Build FFmpeg"
            exit 1
          fi

      - name: Save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ffmpeg-ios
          key: ${{ steps.keys.outputs.ffmpeg }}

      - name: Fetch submodules
        # shellcheck disable=SC2046
        run: git submodule -q update --init --depth=1 --jobs=8 $(awk '/path/ && !/llvm/ && !/FAudio/ && !/feralinteractive/ && !/libsdl-org/ { print $3 }' .gitmodules)

      - name: Build RPCS3 app
        run: |
          if ! .ci/build-ios.sh 2>&1 | tee "$RUNNER_TEMP/core.log"; then
            .ci/annotate-log.sh "$RUNNER_TEMP/core.log" "Build RPCS3 app"
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: RPCS3-iOS-unsigned-ipa
          path: build-ios/RPCS3-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpcs3-ios-core-logs
          path: |
            build-ios/configure.log
            build-ios/build.log
            build-ios/CMakeCache.txt
            build-ios/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
